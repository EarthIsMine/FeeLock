[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.26"
# v4 uses transient storage (EIP-1153)
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
auto_detect_remappings = false
# Monad mainnet fork tests need network: FOUNDRY_PROFILE=fork forge test
no_match_path = "test/*Fork.t.sol"
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 256

[profile.fork]
match_path = "test/*Fork.t.sol"
no_match_path = "test/__none__"

[lint]
lint_on_build = false

# Monad mainnet = 143, testnet = 10143. URLs come from env only (see ../.env.example).
[rpc_endpoints]
monad = "${MONAD_MAINNET_RPC_URL}"
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
